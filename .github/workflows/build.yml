# Every push to main builds the setup .exe and publishes it as a new GitHub release, bumping the patch
# version of the newest v* tag (1.4.0 -> 1.4.1 -> ...). To jump to a new major/minor, raise the version in
# source.extension.vsixmanifest (e.g. 1.5.0); the next push releases exactly that.
# Pushing a tag like v2.0.0 by hand releases that version. Pull requests only build.
name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# Releases must not race each other for the same version number.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $manifest = [version]([xml](Get-Content src\SsmsChatExtension\source.extension.vsixmanifest -Raw)).PackageManifest.Metadata.Identity.Version
            $latest = git tag -l 'v*' | ForEach-Object { $_.TrimStart('v') -as [version] } | Where-Object { $_ } |
                      Sort-Object -Descending | Select-Object -First 1
            $next = if ($latest) { [version]::new($latest.Major, $latest.Minor, $latest.Build + 1) } else { $manifest }
            $version = if ($manifest -gt $next) { $manifest } else { $next }
          }
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build extension and setup
        shell: pwsh
        run: |
          .\Build-Installer.ps1 -Version ${{ steps.version.outputs.version }}
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # A fixed-name copy gives a permanent "latest" download link on GitHub and in blob storage.
          Copy-Item "dist\SsmsClaudeChat-Setup-${{ steps.version.outputs.version }}.exe" dist\SsmsClaudeChat-Setup.exe

      - uses: actions/upload-artifact@v5
        with:
          name: SsmsClaudeChat-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.vsix

      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = (Get-ChildItem dist\*.exe, dist\*.vsix).FullName
          gh release create "v$env:VERSION" @files --target $env:GITHUB_SHA --latest `
            --title "SSMS Claude Chat $env:VERSION" --generate-notes

      # Needs the repository secret AZURE_STORAGE_CONNECTION_STRING; skipped while it is not set.
      # Container defaults to "downloads"; override with the repository variable AZURE_STORAGE_CONTAINER.
      - name: Upload to Azure Blob Storage
        if: github.event_name == 'push' && env.AZURE_STORAGE_CONNECTION_STRING != ''
        shell: pwsh
        env:
          CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || 'downloads' }}
        run: |
          foreach ($file in Get-ChildItem dist\*.exe, dist\*.vsix) {
            az storage blob upload --container-name $env:CONTAINER --file $file.FullName --name $file.Name `
              --overwrite --content-type application/octet-stream --only-show-errors
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }
          Write-Host "Latest setup: $(az storage blob url --container-name $env:CONTAINER --name SsmsClaudeChat-Setup.exe -o tsv)"
