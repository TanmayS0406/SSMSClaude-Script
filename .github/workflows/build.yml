# Every push to main builds the setup .exe and publishes it as a new GitHub release, bumping the patch
# version of the newest v* tag (1.4.0 -> 1.4.1 -> ...). To jump to a new major/minor, raise the version in
# source.extension.vsixmanifest (e.g. 1.5.0); the next push releases exactly that.
# Pushing a tag like v2.0.0 by hand releases that version. Pull requests only build.
name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write   # OIDC sign-in to Azure for code signing (and the blob upload without a SAS)

# Releases must not race each other for the same version number.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      AZURE_STORAGE_SAS_TOKEN: ${{ secrets.AZURE_STORAGE_SAS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pick version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $manifest = [version]([xml](Get-Content src\SsmsChatExtension\source.extension.vsixmanifest -Raw)).PackageManifest.Metadata.Identity.Version
            $latest = git tag -l 'v*' | ForEach-Object { $_.TrimStart('v') -as [version] } | Where-Object { $_ } |
                      Sort-Object -Descending | Select-Object -First 1
            $next = if ($latest) { [version]::new($latest.Major, $latest.Minor, $latest.Build + 1) } else { $manifest }
            $version = if ($manifest -gt $next) { $manifest } else { $next }
          }
          Write-Host "Version: $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      # Signs in with GitHub OIDC as the Entra app in the AZURE_CLIENT_ID variable (federated credential for
      # refs/heads/main). It needs "Artifact Signing Certificate Profile Signer" on the signing account to sign.
      - name: Sign in to Azure
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Code signing with Azure Artifact Signing, on while ARTIFACT_SIGNING_PROFILE (certificate profile name) is set.
      # Microsoft Store requires the setup and every PE file in it to be signed.
      - name: Set up code signing
        id: signing
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AZURE_CLIENT_ID != '' && vars.ARTIFACT_SIGNING_PROFILE != ''
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT || 'Signs' }}
          PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile "$dir\nuget.exe"
          & "$dir\nuget.exe" install Microsoft.Windows.SDK.BuildTools -x -OutputDirectory $dir -Verbosity quiet
          & "$dir\nuget.exe" install Microsoft.ArtifactSigning.Client -x -OutputDirectory $dir -Verbosity quiet
          $signtool = Get-ChildItem $dir -Recurse -Filter signtool.exe | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          $dlib = Get-ChildItem $dir -Recurse -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1
          if (-not $signtool -or -not $dlib) { throw "signtool.exe or Azure.CodeSigning.Dlib.dll (x64) not found." }

          # Authenticate with the az CLI session from azure/login only.
          @{
            Endpoint = $env:ENDPOINT; CodeSigningAccountName = $env:ACCOUNT; CertificateProfileName = $env:PROFILE
            CorrelationId = "github-$env:GITHUB_RUN_ID"
            ExcludeCredentials = @('EnvironmentCredential', 'ManagedIdentityCredential', 'WorkloadIdentityCredential',
              'SharedTokenCacheCredential', 'VisualStudioCredential', 'VisualStudioCodeCredential',
              'AzurePowerShellCredential', 'AzureDeveloperCliCredential', 'InteractiveBrowserCredential')
          } | ConvertTo-Json | Set-Content "$dir\metadata.json" -Encoding utf8NoBOM

          $command = "`"$($signtool.FullName)`" sign /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 " +
                     "/dlib `"$($dlib.FullName)`" /dmdf `"$dir\metadata.json`""
          "command=$command" >> $env:GITHUB_OUTPUT

      - name: Build extension and setup
        shell: pwsh
        env:
          SIGN: ${{ steps.signing.outputs.command }}
        run: |
          if ($env:SIGN) {
            .\Build-Installer.ps1 -Version ${{ steps.version.outputs.version }} -SignCommand $env:SIGN
          } else {
            .\Build-Installer.ps1 -Version ${{ steps.version.outputs.version }}
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # A fixed-name copy gives a permanent "latest" download link on GitHub and in blob storage.
          Copy-Item "dist\SsmsClaudeChat-Setup-${{ steps.version.outputs.version }}.exe" dist\SsmsClaudeChat-Setup.exe

      - uses: actions/upload-artifact@v6
        with:
          name: SsmsClaudeChat-${{ steps.version.outputs.version }}
          path: |
            dist/*.exe
            dist/*.vsix

      - name: Publish release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $files = (Get-ChildItem dist\*.exe, dist\*.vsix).FullName
          gh release create "v$env:VERSION" @files --target $env:GITHUB_SHA --latest `
            --title "SSMS Claude Chat $env:VERSION" --generate-notes

      # Blob upload auth: the AZURE_STORAGE_SAS_TOKEN secret (a SAS for the container with create/write rights),
      # or else the Azure sign-in above (Entra app with "Storage Blob Data Contributor" on the container).
      # Skipped while neither is set.
      - name: Upload to Azure Blob Storage
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && (env.AZURE_STORAGE_SAS_TOKEN != '' || vars.AZURE_CLIENT_ID != '')
        shell: pwsh
        env:
          ACCOUNT: ${{ vars.AZURE_STORAGE_ACCOUNT || 'sbsbuilds1998' }}
          CONTAINER: ${{ vars.AZURE_STORAGE_CONTAINER || 'downloads' }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Layout: <version>/SsmsClaudeChat-Setup-<version>.exe and .vsix, plus version.json at the root, which the
          # website reads to find (and stream) the newest setup.
          # az reads AZURE_STORAGE_SAS_TOKEN from the environment; passing it as an argument would break on its '&'s
          # (az.cmd goes through cmd.exe).
          $auth = if ($env:AZURE_STORAGE_SAS_TOKEN) { @() } else { @('--auth-mode', 'login') }
          function Upload($file, $name, $type, $cache) {
            az storage blob upload @auth --account-name $env:ACCOUNT --container-name $env:CONTAINER `
              --file $file --name $name --overwrite --content-type $type --content-cache-control $cache --only-show-errors
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

          $setup = "SsmsClaudeChat-Setup-$env:VERSION.exe"
          foreach ($name in $setup, "SsmsClaudeChat-$env:VERSION.vsix") {
            Upload "dist\$name" "$env:VERSION/$name" 'application/octet-stream' 'public, max-age=31536000, immutable'
          }

          @{ version = $env:VERSION; path = "$env:VERSION/$setup"; file = $setup; published = (Get-Date).ToUniversalTime().ToString('o') } |
            ConvertTo-Json | Set-Content dist\version.json -Encoding utf8NoBOM
          Upload 'dist\version.json' 'version.json' 'application/json' 'public, max-age=300'
          Write-Host "Uploaded $env:CONTAINER/$env:VERSION/$setup"
